<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="qr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#qr-bg)"/>
  
  <!-- Outer Finder 1 (Top-Left) -->
  <rect x="96" y="96" width="112" height="112" rx="20" fill="none" stroke="#ffffff" stroke-width="24"/>
  <rect x="136" y="136" width="32" height="32" rx="8" fill="#ffffff"/>
  
  <!-- Outer Finder 2 (Top-Right) -->
  <rect x="304" y="96" width="112" height="112" rx="20" fill="none" stroke="#ffffff" stroke-width="24"/>
  <rect x="344" y="136" width="32" height="32" rx="8" fill="#ffffff"/>
  
  <!-- Outer Finder 3 (Bottom-Left) -->
  <rect x="96" y="304" width="112" height="112" rx="20" fill="none" stroke="#ffffff" stroke-width="24"/>
  <rect x="136" y="344" width="32" height="32" rx="8" fill="#ffffff"/>
  
  <!-- Matrix Data Dots & Blocks -->
  <rect x="240" y="104" width="28" height="28" rx="6" fill="#ffffff"/>
  <rect x="240" y="176" width="28" height="28" rx="6" fill="#ffffff"/>
  <rect x="104" y="240" width="28" height="28" rx="6" fill="#ffffff"/>
  <rect x="176" y="240" width="28" height="28" rx="6" fill="#ffffff"/>
  <rect x="240" y="240" width="28" height="28" rx="6" fill="#ffffff"/>
  
  <rect x="304" y="240" width="32" height="32" rx="8" fill="#ffffff"/>
  <rect x="384" y="240" width="32" height="32" rx="8" fill="#ffffff"/>
  <rect x="240" y="320" width="32" height="64" rx="8" fill="#ffffff"/>
  <rect x="320" y="320" width="64" height="32" rx="8" fill="#ffffff"/>
  <rect x="320" y="384" width="32" height="32" rx="8" fill="#ffffff"/>
  <rect x="384" y="384" width="32" height="32" rx="8" fill="#ffffff"/>
  
  <!-- Horizontal Laser Scan Line Highlight -->
  <rect x="64" y="250" width="384" height="12" rx="6" fill="#60a5fa" opacity="0.9"/>
</svg>
