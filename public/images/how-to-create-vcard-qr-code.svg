<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="vcardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#vcardBg)" />

  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1" />
    <text x="110" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#a5b4fc" text-anchor="middle">DIGITAL BUSINESS CARDS</text>

    <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff">
      How to Create a
    </text>
    <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#purpleGrad)">
      vCard QR Code
    </text>

    <text x="0" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8" width="460">
      Turn printed business cards into one-tap address book contacts.
    </text>

    <g transform="translate(0, 240)" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#cbd5e1">
      <g>
        <circle cx="12" cy="12" r="10" fill="#6366f1" />
        <path d="M8 12l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="34" y="17">vCard standard RFC 6350 compliance</text>
      </g>
      <g transform="translate(0, 42)">
        <circle cx="12" cy="12" r="10" fill="#6366f1" />
        <path d="M8 12l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="34" y="17">Instant save to iPhone Contacts &amp; Google Contacts</text>
      </g>
      <g transform="translate(0, 84)">
        <circle cx="12" cy="12" r="10" fill="#6366f1" />
        <path d="M8 12l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="34" y="17">Optimization guide for physical business card print density</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: Business card + Contact popup -->
  <g transform="translate(720, 140)">
    <!-- Slanted Business Card -->
    <g transform="rotate(-6 180 120)">
      <rect x="0" y="0" width="360" height="220" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
      <text x="30" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Alex Morgan</text>
      <text x="30" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#6366f1">Head of Engineering</text>
      <text x="30" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">alex@example.com</text>
      <text x="30" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">+1 (555) 234-5678</text>

      <!-- Mini QR on card -->
      <rect x="230" y="45" width="100" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <rect x="242" y="57" width="22" height="22" fill="#0f172a" />
      <rect x="296" y="57" width="22" height="22" fill="#0f172a" />
      <rect x="242" y="111" width="22" height="22" fill="#0f172a" />
      <rect x="270" y="70" width="12" height="12" fill="#6366f1" />
      <rect x="270" y="95" width="16" height="16" fill="#0f172a" />
      <rect x="295" y="100" width="16" height="16" fill="#6366f1" />
    </g>

    <!-- Smartphone Contact Dialog floating over -->
    <g transform="translate(140, 110)">
      <rect x="0" y="0" width="260" height="220" rx="20" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <circle cx="130" cy="50" r="26" fill="#6366f1" />
      <text x="130" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">AM</text>
      <text x="130" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Alex Morgan</text>
      <text x="130" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Head of Engineering</text>

      <rect x="30" y="145" width="200" height="40" rx="10" fill="#4f46e5" />
      <text x="130" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Create New Contact</text>
    </g>
  </g>
</svg>
