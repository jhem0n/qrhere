<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="guideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#guideBg)" />

  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1" />
    <text x="110" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fcd34d" text-anchor="middle">PHYSICAL PRINTING GUIDE</text>

    <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff">
      QR Code Size, Ratio &amp;
    </text>
    <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#amberGrad)">
      Print Quality Standards
    </text>

    <text x="0" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8" width="460">
      The definitive 10:1 distance-to-size formula, quiet zone rules, and vector specs.
    </text>

    <g transform="translate(0, 240)" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#cbd5e1">
      <g>
        <circle cx="12" cy="12" r="10" fill="#d97706" />
        <path d="M8 12l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="34" y="17">Minimum physical size: 20 mm x 20 mm (0.8 in)</text>
      </g>
      <g transform="translate(0, 42)">
        <circle cx="12" cy="12" r="10" fill="#d97706" />
        <path d="M8 12l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="34" y="17">10:1 Distance rule: 1 m viewing distance = 10 cm QR width</text>
      </g>
      <g transform="translate(0, 84)">
        <circle cx="12" cy="12" r="10" fill="#d97706" />
        <path d="M8 12l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="34" y="17">SVG vs 300+ DPI raster requirements for commercial printing</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: Ruler & QR Dimensions diagram -->
  <g transform="translate(740, 130)">
    <rect x="0" y="0" width="360" height="360" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- Quiet zone boundary -->
    <rect x="50" y="50" width="260" height="260" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 6" />
    <text x="180" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">Quiet Zone (4 modules margin)</text>

    <!-- QR Matrix inside -->
    <rect x="80" y="80" width="200" height="200" rx="6" fill="#ffffff" />
    <!-- Eyes -->
    <rect x="95" y="95" width="46" height="46" fill="#0f172a" rx="4" />
    <rect x="102" y="102" width="32" height="32" fill="#ffffff" />
    <rect x="109" y="109" width="18" height="18" fill="#d97706" />

    <rect x="219" y="95" width="46" height="46" fill="#0f172a" rx="4" />
    <rect x="226" y="102" width="32" height="32" fill="#ffffff" />
    <rect x="233" y="109" width="18" height="18" fill="#d97706" />

    <rect x="95" y="219" width="46" height="46" fill="#0f172a" rx="4" />
    <rect x="102" y="226" width="32" height="32" fill="#ffffff" />
    <rect x="109" y="233" width="18" height="18" fill="#d97706" />

    <!-- Center pattern -->
    <rect x="155" y="110" width="15" height="15" fill="#0f172a" />
    <rect x="180" y="110" width="25" height="15" fill="#0f172a" />
    <rect x="155" y="135" width="25" height="25" fill="#d97706" />
    <rect x="155" y="170" width="15" height="40" fill="#0f172a" />
    <rect x="180" y="175" width="25" height="15" fill="#0f172a" />
    <rect x="215" y="150" width="15" height="20" fill="#0f172a" />
    <rect x="215" y="180" width="25" height="25" fill="#0f172a" />
    <rect x="155" y="225" width="40" height="15" fill="#0f172a" />
    <rect x="180" y="245" width="20" height="20" fill="#d97706" />

    <!-- Dimension arrows -->
    <path d="M 50 330 L 310 330" stroke="#94a3b8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="50" y1="320" x2="50" y2="340" stroke="#94a3b8" stroke-width="2" />
    <line x1="310" y1="320" x2="310" y2="340" stroke="#94a3b8" stroke-width="2" />
    <text x="180" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">Width = Distance / 10 (Min 20 mm)</text>
  </g>
</svg>
