<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="scanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="scanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#scanBg)" />

  <!-- Background decorative lines -->
  <g stroke="#1f2937" stroke-width="1" opacity="0.6">
    <circle cx="950" cy="315" r="280" fill="none" />
    <circle cx="950" cy="315" r="210" fill="none" stroke-dasharray="8 8" />
    <circle cx="950" cy="315" r="140" fill="none" />
  </g>

  <!-- Left Copy -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
    <text x="110" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">NATIVE CAMERA SCANNING</text>

    <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff">
      Scan Any QR Code
    </text>
    <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#scanGlow)">
      Without Third-Party Apps
    </text>

    <text x="0" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#9ca3af" width="460">
      Avoid shady ad-filled barcode scanner apps on App Store &amp; Google Play.
    </text>

    <g transform="translate(0, 240)" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#d1d5db">
      <!-- Feature 1 -->
      <g>
        <circle cx="12" cy="12" r="10" fill="#059669" />
        <path d="M8 12l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="34" y="17"><tspan font-weight="bold" fill="#ffffff">iOS 11+</tspan>: Built-in Camera App with instant yellow banner</text>
      </g>
      <!-- Feature 2 -->
      <g transform="translate(0, 42)">
        <circle cx="12" cy="12" r="10" fill="#059669" />
        <path d="M8 12l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="34" y="17"><tspan font-weight="bold" fill="#ffffff">Android 9+</tspan>: Google Lens &amp; native viewfinder integration</text>
      </g>
      <!-- Feature 3 -->
      <g transform="translate(0, 84)">
        <circle cx="12" cy="12" r="10" fill="#059669" />
        <path d="M8 12l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="34" y="17"><tspan font-weight="bold" fill="#ffffff">Desktop &amp; Web</tspan>: QR Here camera or image drop (in-browser)</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: Camera Viewfinder with Target Bounds -->
  <g transform="translate(760, 115)">
    <!-- Viewfinder bounds -->
    <rect x="0" y="0" width="340" height="400" rx="28" fill="#1f2937" stroke="#374151" stroke-width="2" />
    <rect x="15" y="15" width="310" height="370" rx="20" fill="#030712" />

    <!-- Reticle corner markers -->
    <path d="M50 70 L80 70 M50 70 L50 100" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
    <path d="M290 70 L260 70 M290 70 L290 100" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
    <path d="M50 330 L80 330 M50 330 L50 300" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
    <path d="M290 330 L260 330 M290 330 L290 300" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

    <!-- Center QR target -->
    <g transform="translate(85, 115)">
      <rect x="0" y="0" width="170" height="170" rx="8" fill="#ffffff" />
      <!-- Eyes -->
      <rect x="15" y="15" width="40" height="40" fill="#090d16" rx="4" />
      <rect x="22" y="22" width="26" height="26" fill="#ffffff" />
      <rect x="28" y="28" width="14" height="14" fill="#059669" />

      <rect x="115" y="15" width="40" height="40" fill="#090d16" rx="4" />
      <rect x="122" y="22" width="26" height="26" fill="#ffffff" />
      <rect x="128" y="28" width="14" height="14" fill="#059669" />

      <rect x="15" y="115" width="40" height="40" fill="#090d16" rx="4" />
      <rect x="22" y="122" width="26" height="26" fill="#ffffff" />
      <rect x="28" y="128" width="14" height="14" fill="#059669" />

      <!-- Dots pattern -->
      <rect x="65" y="20" width="15" height="15" fill="#090d16" />
      <rect x="90" y="20" width="15" height="15" fill="#090d16" />
      <rect x="65" y="45" width="25" height="15" fill="#059669" />
      <rect x="65" y="70" width="15" height="25" fill="#090d16" />
      <rect x="90" y="70" width="30" height="15" fill="#090d16" />
      <rect x="130" y="70" width="25" height="20" fill="#090d16" />
      <rect x="65" y="105" width="20" height="20" fill="#090d16" />
      <rect x="95" y="105" width="25" height="20" fill="#059669" />
      <rect x="70" y="135" width="40" height="15" fill="#090d16" />
      <rect x="125" y="115" width="15" height="35" fill="#090d16" />

      <!-- Laser scan line -->
      <line x1="-15" y1="85" x2="185" y2="85" stroke="#10b981" stroke-width="3" filter="url(#glow)" />
    </g>

    <!-- Detected Banner Popup -->
    <g transform="translate(35, 305)" filter="url(#glow)">
      <rect x="0" y="0" width="270" height="48" rx="12" fill="#10b981" />
      <text x="135" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Open "https://qrhere.online" in Safari</text>
    </g>
  </g>
</svg>
