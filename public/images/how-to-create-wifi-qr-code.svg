<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid accent lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left Content (Text) -->
  <g transform="translate(100, 140)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1" />
    <text x="80" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">WI-FI QR CODES</text>

    <!-- Title -->
    <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff">
      How to Connect
    </text>
    <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)">
      Wi-Fi With QR Codes
    </text>

    <text x="0" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8" width="460">
      Zero typing. Instant guest onboarding. WPA2 &amp; WPA3 support.
    </text>

    <!-- Checklist items -->
    <g transform="translate(0, 240)" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#cbd5e1">
      <circle cx="12" cy="12" r="10" fill="#0284c7" />
      <path d="M8 12l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
      <text x="34" y="17">WIFI:S:&lt;SSID&gt;;T:WPA;P:&lt;pass&gt;;; standard string</text>

      <g transform="translate(0, 42)">
        <circle cx="12" cy="12" r="10" fill="#0284c7" />
        <path d="M8 12l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="34" y="17">Native iOS and Android one-tap join dialog</text>
      </g>

      <g transform="translate(0, 84)">
        <circle cx="12" cy="12" r="10" fill="#0284c7" />
        <path d="M8 12l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="34" y="17">100% Client-side generation — passwords never leave device</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Card (Phone + QR Simulation) -->
  <g transform="translate(740, 95)" filter="url(#shadow)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="340" height="460" rx="36" fill="#020617" stroke="#334155" stroke-width="3" />
    <!-- Screen Notch/Speaker -->
    <rect x="110" y="14" width="120" height="18" rx="9" fill="#1e293b" />
    
    <!-- Screen content -->
    <rect x="18" y="44" width="304" height="398" rx="24" fill="#0f172a" />

    <!-- WiFi Icon Pulse -->
    <circle cx="170" cy="110" r="38" fill="#0284c7" fill-opacity="0.15" />
    <path d="M146 112 A32 32 0 0 1 194 112 M152 118 A22 22 0 0 1 188 118 M160 124 A12 12 0 0 1 180 124 M170 130 A2 2 0 0 1 170 132" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- QR Container -->
    <rect x="75" y="170" width="190" height="190" rx="16" fill="#ffffff" />

    <!-- QR Pattern Mockup -->
    <!-- Position Detection Patterns (Corners) -->
    <!-- Top-left -->
    <rect x="91" y="186" width="46" height="46" fill="#0f172a" rx="4" />
    <rect x="97" y="192" width="34" height="34" fill="#ffffff" rx="2" />
    <rect x="103" y="198" width="22" height="22" fill="#0284c7" rx="2" />

    <!-- Top-right -->
    <rect x="203" y="186" width="46" height="46" fill="#0f172a" rx="4" />
    <rect x="209" y="192" width="34" height="34" fill="#ffffff" rx="2" />
    <rect x="215" y="198" width="22" height="22" fill="#0284c7" rx="2" />

    <!-- Bottom-left -->
    <rect x="91" y="298" width="46" height="46" fill="#0f172a" rx="4" />
    <rect x="97" y="304" width="34" height="34" fill="#ffffff" rx="2" />
    <rect x="103" y="310" width="22" height="22" fill="#0284c7" rx="2" />

    <!-- Data matrix bits -->
    <rect x="145" y="190" width="12" height="12" fill="#0f172a" />
    <rect x="165" y="190" width="12" height="12" fill="#0f172a" />
    <rect x="180" y="200" width="12" height="12" fill="#0f172a" />
    <rect x="145" y="210" width="12" height="12" fill="#0284c7" />
    <rect x="160" y="225" width="20" height="12" fill="#0f172a" />
    <rect x="185" y="225" width="12" height="12" fill="#0f172a" />
    <rect x="145" y="250" width="12" height="12" fill="#0f172a" />
    <rect x="165" y="250" width="12" height="12" fill="#0284c7" />
    <rect x="180" y="250" width="20" height="12" fill="#0f172a" />
    <rect x="145" y="275" width="20" height="12" fill="#0f172a" />
    <rect x="175" y="275" width="12" height="12" fill="#0f172a" />
    <rect x="205" y="250" width="12" height="12" fill="#0f172a" />
    <rect x="220" y="270" width="20" height="12" fill="#0f172a" />
    <rect x="205" y="290" width="12" height="12" fill="#0284c7" />
    <rect x="145" y="300" width="12" height="12" fill="#0f172a" />
    <rect x="165" y="315" width="20" height="12" fill="#0f172a" />
    <rect x="220" y="320" width="12" height="12" fill="#0f172a" />

    <!-- Join Banner overlay -->
    <g transform="translate(30, 375)">
      <rect x="0" y="0" width="280" height="50" rx="14" fill="#0284c7" />
      <text x="140" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Tap to Join "Guest-5G"</text>
    </g>
  </g>
</svg>
