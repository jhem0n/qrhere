<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="eccBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#eccBg)" />

  <!-- Grid overlay -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Left Copy Block -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="260" height="34" rx="17" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1" />
    <text x="130" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">REED-SOLOMON ALGORITHMS</text>

    <text x="0" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#ffffff">
      QR Error Correction
    </text>
    <text x="0" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="url(#cyanBlue)">
      Levels L, M, Q &amp; H
    </text>

    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#94a3b8" width="460">
      How mathematical redundancy restores missing data, supports logo embedding, and prevents scanning failures.
    </text>

    <!-- 4 Level Comparison Bars -->
    <g transform="translate(0, 230)">
      <!-- Level L -->
      <g>
        <rect x="0" y="0" width="100" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="50" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#94a3b8" text-anchor="middle">Level L</text>
        <rect x="115" y="12" width="180" height="18" rx="9" fill="#1e293b" />
        <rect x="115" y="12" width="42" height="18" rx="9" fill="#64748b" />
        <text x="310" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">~7% recovery (High Density)</text>
      </g>

      <!-- Level M -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="100" height="42" rx="8" fill="#0f2b48" stroke="#0284c7" stroke-width="1" />
        <text x="50" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#38bdf8" text-anchor="middle">Level M</text>
        <rect x="115" y="12" width="180" height="18" rx="9" fill="#1e293b" />
        <rect x="115" y="12" width="90" height="18" rx="9" fill="#0284c7" />
        <text x="310" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">~15% recovery (Standard Default)</text>
      </g>

      <!-- Level Q -->
      <g transform="translate(0, 104)">
        <rect x="0" y="0" width="100" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="50" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#94a3b8" text-anchor="middle">Level Q</text>
        <rect x="115" y="12" width="180" height="18" rx="9" fill="#1e293b" />
        <rect x="115" y="12" width="150" height="18" rx="9" fill="#6366f1" />
        <text x="310" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">~25% recovery (Industrial/Wear)</text>
      </g>

      <!-- Level H -->
      <g transform="translate(0, 156)">
        <rect x="0" y="0" width="100" height="42" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
        <text x="50" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#a5b4fc" text-anchor="middle">Level H</text>
        <rect x="115" y="12" width="180" height="18" rx="9" fill="#1e293b" />
        <rect x="115" y="12" width="180" height="18" rx="9" fill="#818cf8" />
        <text x="310" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#a5b4fc">~30% recovery (Mandatory for Logos)</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: QR Matrix with Damaged Modules Rebuilt via ECC -->
  <g transform="translate(730, 100)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="390" height="430" rx="28" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

    <!-- QR Code white card inside -->
    <rect x="35" y="35" width="320" height="320" rx="16" fill="#ffffff" />

    <!-- Finder Eye: Top Left -->
    <g transform="translate(60, 60)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="#0f172a" />
      <rect x="8" y="8" width="44" height="44" rx="4" fill="#ffffff" />
      <rect x="16" y="16" width="28" height="28" rx="2" fill="#0284c7" />
    </g>

    <!-- Finder Eye: Top Right -->
    <g transform="translate(260, 60)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="#0f172a" />
      <rect x="8" y="8" width="44" height="44" rx="4" fill="#ffffff" />
      <rect x="16" y="16" width="28" height="28" rx="2" fill="#0284c7" />
    </g>

    <!-- Finder Eye: Bottom Left -->
    <g transform="translate(60, 260)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="#0f172a" />
      <rect x="8" y="8" width="44" height="44" rx="4" fill="#ffffff" />
      <rect x="16" y="16" width="28" height="28" rx="2" fill="#0284c7" />
    </g>

    <!-- Data Modules (Simulated Matrix) -->
    <g fill="#0f172a">
      <rect x="135" y="65" width="16" height="16" />
      <rect x="160" y="65" width="16" height="16" />
      <rect x="185" y="65" width="16" height="16" />
      <rect x="210" y="65" width="16" height="16" />
      <rect x="135" y="90" width="16" height="16" />
      <rect x="185" y="90" width="16" height="16" />
      <rect x="135" y="115" width="16" height="16" />
      <rect x="160" y="115" width="16" height="16" />
      <rect x="210" y="115" width="16" height="16" />
      
      <rect x="65" y="135" width="16" height="16" />
      <rect x="90" y="135" width="16" height="16" />
      <rect x="115" y="135" width="16" height="16" />
      <rect x="65" y="160" width="16" height="16" />
      <rect x="90" y="185" width="16" height="16" />
      <rect x="115" y="210" width="16" height="16" />
      
      <rect x="260" y="135" width="16" height="16" />
      <rect x="285" y="135" width="16" height="16" />
      <rect x="310" y="160" width="16" height="16" />
      <rect x="260" y="185" width="16" height="16" />
      <rect x="285" y="210" width="16" height="16" />

      <rect x="135" y="260" width="16" height="16" />
      <rect x="160" y="260" width="16" height="16" />
      <rect x="185" y="285" width="16" height="16" />
      <rect x="210" y="285" width="16" height="16" />
      <rect x="135" y="310" width="16" height="16" />
      <rect x="160" y="310" width="16" height="16" />
      <rect x="210" y="310" width="16" height="16" />
    </g>

    <!-- Center Logo Knockout Simulation -->
    <g transform="translate(150, 150)">
      <rect x="0" y="0" width="80" height="80" rx="16" fill="#0284c7" />
      <path d="M25 40 L35 50 L55 30" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Damaged Module Overlay with Recovery Ring -->
    <g transform="translate(235, 235)">
      <!-- Scratch line -->
      <line x1="-15" y1="-15" x2="35" y2="35" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
      <line x1="35" y1="-15" x2="-15" y2="35" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Bottom Status Pill -->
    <g transform="translate(45, 372)">
      <rect x="0" y="0" width="300" height="42" rx="12" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1.5" />
      <text x="150" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">
        Decoded: 100% of Payload Restored
      </text>
    </g>
  </g>
</svg>
